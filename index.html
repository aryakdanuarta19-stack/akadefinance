<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Akade Finance</title>
<meta name="description" content="Personal finance tracker, rupiah dan dollar.">
<meta name="theme-color" content="#050403">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Akade Finance">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..700&family=Plus+Jakarta+Sans:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app" id="app" hidden>
  <aside class="rail" aria-label="Main menu">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Akade Finance</span>
    </div>
    <span class="sword" aria-hidden="true"></span>
    <nav class="rail-nav" id="railNav"></nav>
    <div class="rail-foot">
      <div class="rate-block" id="rateBlock"></div>
      <button class="ghost-btn" type="button" data-act="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        Settings
      </button>
      <div class="sync" id="syncRail"></div>
    </div>
  </aside>

  <div class="main">
    <header class="top">
      <div class="brand brand--top">
        <span class="brand-mark" aria-hidden="true"></span>
      </div>
      <div class="month" id="monthNav"></div>
      <div class="top-right">
        <span class="rate-pill" id="ratePill"></span>
        <button class="icon-btn only-mobile" type="button" data-act="settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </header>

    <form class="quick" id="quick" autocomplete="off">
      <div class="quick-preview" id="quickPreview" aria-live="polite"></div>
      <div class="quick-row">
        <label class="sr" for="quickInput">Quick add</label>
        <input id="quickInput" type="text" inputmode="text" enterkeyhint="done"
               placeholder="" autocapitalize="off" spellcheck="false">
        <button class="primary-btn" type="submit">Add</button>
      </div>
    </form>

    <main class="view" id="view" tabindex="-1"></main>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Main menu"></nav>
</div>

<!-- Layar masuk (hanya muncul kalau sinkron aktif) -->
<div class="gate" id="gate" hidden>
  <form class="gate-card" id="gateForm">
    <span class="brand-mark brand-mark--lg" aria-hidden="true"></span>
    <h1>Akade Finance</h1>
    <p class="gate-sub">Sign in buat buka catatanmu.</p>
    <label>Email
      <input type="email" id="gateEmail" required autocomplete="email">
    </label>
    <label>Password
      <input type="password" id="gatePass" required minlength="6" autocomplete="current-password">
    </label>
    <p class="gate-msg" id="gateMsg" role="status"></p>
    <button class="primary-btn" type="submit" data-mode="in">Sign in</button>
    <button class="text-btn" type="button" id="gateSignup">Create account</button>
  </form>
</div>

<dialog class="sheet" id="editDlg"></dialog>
<dialog class="sheet" id="settingsDlg"></dialog>
<div class="tip" id="tip" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
